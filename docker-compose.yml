services:
  postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres/init:/docker-entrypoint-initdb.d/
      - ./volumes/postgres/data:/var/lib/postgresql/data