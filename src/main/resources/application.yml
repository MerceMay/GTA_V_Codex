spring:
  application:
    name: ai-agent
  ai:
    openai:
      api-key: ollama
      base-url: http://localhost:11434
      chat:
        options:
          model: qwen3:8b
      embedding:
        options:
          model: qwen3-embedding:0.6b # dimensions: 1024
    chat:
      memory:
        repository:
          jdbc:
            platform: postgresql
            initialize-schema: always
    vectorstore:
      pgvector:
        dimensions: 1024
        initialize-schema: true
        distance-type: cosine_distance
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres?ssl=false
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
server:
  port: 8080
  servlet:
    context-path: /api

# springdoc-openapi configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mercemay.aiagent.controller

# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn