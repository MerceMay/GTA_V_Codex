spring:
  application:
    name: ai-agent
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:dummy}
      base-url: ${OPENAI_BASE_URL:https://api.siliconflow.cn}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:Qwen/Qwen3-8B}
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:Qwen/Qwen3-Embedding-8B}
    chat:
      memory:
        repository:
          jdbc:
            platform: postgresql
            initialize-schema: always
    vectorstore:
      redis:
        initialize-schema: true
        prefix: "vectorstore:" # Prefix for Redis keys
        index-name: "vector_index" # Name of the RediSearch index
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: localhost
      port: 6379
server:
  port: 8080
  servlet:
    context-path: /api

# springdoc-openapi configuration
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.mercemay.aiagent.controller

# knife4j config
knife4j:
  enable: true
  setting:
    language: zh_cn
